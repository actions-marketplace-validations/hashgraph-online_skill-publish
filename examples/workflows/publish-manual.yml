name: Publish Skill (Manual)

on:
  workflow_dispatch:
    inputs:
      publish_target:
        type: choice
        required: true
        default: staging
        options:
          - staging
          - production
      version:
        type: string
        required: false
      annotate:
        type: choice
        required: true
        default: "false"
        options:
          - "false"
          - "true"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Resolve broker API URL
        id: target
        shell: bash
        run: |
          if [[ "${{ inputs.publish_target }}" == "staging" ]]; then
            echo "api_base_url=https://registry-staging.hol.org/registry/api/v1" >> "$GITHUB_OUTPUT"
          else
            echo "api_base_url=https://hol.org/registry/api/v1" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare skill package
        id: package
        shell: bash
        run: |
          SOURCE_DIR="skills/my-skill"
          PACKAGE_DIR="publish-package-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${PACKAGE_DIR}/references" "${PACKAGE_DIR}/schemas"
          cp "${SOURCE_DIR}/SKILL.md" "${SOURCE_DIR}/skill.json" "${PACKAGE_DIR}/"
          if [[ -f "${SOURCE_DIR}/apis.json" ]]; then
            cp "${SOURCE_DIR}/apis.json" "${PACKAGE_DIR}/"
          fi
          if [[ -f "${SOURCE_DIR}/llms.txt" ]]; then
            cp "${SOURCE_DIR}/llms.txt" "${PACKAGE_DIR}/"
          fi
          if [[ -d "${SOURCE_DIR}/references" ]]; then
            shopt -s nullglob
            reference_files=("${SOURCE_DIR}"/references/*.md)
            if (( ${#reference_files[@]} > 0 )); then
              cp "${reference_files[@]}" "${PACKAGE_DIR}/references/"
            fi
          fi
          if [[ -f "${SOURCE_DIR}/schemas/skill.schema.json" ]]; then
            cp "${SOURCE_DIR}/schemas/skill.schema.json" "${PACKAGE_DIR}/schemas/"
          fi
          echo "dir=${PACKAGE_DIR}" >> "$GITHUB_OUTPUT"
      - name: Resolve publish version
        id: version_resolve
        shell: bash
        run: |
          VERSION_INPUT="${{ inputs.version }}"
          if [[ -n "${VERSION_INPUT}" ]]; then
            RESOLVED_VERSION="${VERSION_INPUT}"
          else
            RESOLVED_VERSION="$(node -p "require('./skills/my-skill/skill.json').version")"
          fi
          echo "version=${RESOLVED_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Publish skill package
        uses: hashgraph-online/skill-publish@df6ae95e010d9792158a441eec9ac50d4d17139d
        with:
          mode: publish
          api-base-url: ${{ steps.target.outputs.api_base_url }}
          api-key: ${{ secrets.RB_API_KEY }}
          skill-dir: ${{ steps.package.outputs.dir }}
          version: ${{ steps.version_resolve.outputs.version }}
          annotate: ${{ inputs.annotate }}
          submit-indexnow: "true"
          github-token: ${{ github.token }}
