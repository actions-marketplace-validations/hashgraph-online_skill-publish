name: Release Assets

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  HOL_SKILL_PUBLISH_DOCS_URL: https://hol.org/registry/skills/publish

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install validation dependencies
        run: npm install --no-save ajv@8 ajv-formats@3

      - name: Validate schema before release
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const Ajv2020 = require('ajv/dist/2020').default;
          const addFormats = require('ajv-formats').default;

          const schema = JSON.parse(fs.readFileSync('schemas/skill.schema.json', 'utf8'));
          const example = JSON.parse(fs.readFileSync('examples/skill.json', 'utf8'));

          const ajv = new Ajv2020({ allErrors: true, strict: false });
          addFormats(ajv);
          const validate = ajv.compile(schema);
          const ok = validate(example);

          if (!ok) {
            console.error(JSON.stringify(validate.errors, null, 2));
            process.exit(1);
          }

          console.log('Schema validation passed.');
          NODE

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            action.yml
            entrypoint.mjs
            schemas/skill.schema.json
            examples/skill.json
            README.md
            CITATION.cff
            .zenodo.json
            apis.json
            llms.txt

      - name: Ensure release includes canonical docs URL
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          docs_line="- Documentation: ${HOL_SKILL_PUBLISH_DOCS_URL}"
          body="$(gh release view "${tag}" --repo "${GH_REPO}" --json body --jq '.body // ""')"

          if printf '%s' "${body}" | grep -Fq "${HOL_SKILL_PUBLISH_DOCS_URL}"; then
            echo "Release ${tag} already contains canonical docs URL."
            exit 0
          fi

          notes_file="$(mktemp)"
          {
            printf '%s\n' "${body}"
            printf '\n%s\n' "${docs_line}"
          } > "${notes_file}"
          gh release edit "${tag}" --repo "${GH_REPO}" --notes-file "${notes_file}"
          rm -f "${notes_file}"
